name: OS source validation
on:
  push:
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax and appliance files
        shell: bash
        run: |
          set -euo pipefail
          bash -n build/auto/config build/auto/build build/build-image.sh
          kiosk=build/config/includes.chroot/usr/local/bin/dede-kodi-kiosk
          hook=build/config/hooks/live/0500-dede-kiosk.hook.chroot
          unit=build/config/includes.chroot/etc/systemd/system/dede-kodi.service
          probe=build/config/includes.chroot/usr/local/bin/dede-kiosk-probe
          probe_unit=build/config/includes.chroot/etc/systemd/system/dede-kiosk-probe.service
          probe_timer=build/config/includes.chroot/etc/systemd/system/dede-kiosk-probe.timer
          sh -n "$kiosk" "$hook" "$probe"
          test -s "$probe_unit" && test -s "$probe_timer"
          grep -q "DEDE_KIOSK_PROBE_BEGIN" "$probe"
          test -s "$unit"
          test -s build/config/package-lists/dede-base.list.chroot
          grep -q -- '--distribution trixie' build/auto/config
          for package in linux-image-amd64 kodi kodi-pvr-iptvsimple xinit xserver-xorg-core; do
            grep -qx "$package" build/config/package-lists/dede-base.list.chroot
          done
          grep -qx 'User=dede' "$unit"
          grep -qx 'NoNewPrivileges=true' "$unit"
          # A clean Kodi exit must not strand the appliance on a blank screen.
          grep -qx 'Restart=always' "$unit"
          grep -qx 'RestartSec=5' "$unit"
          grep -qx 'RuntimeDirectory=dede-tv' "$unit"
          grep -qx 'RuntimeDirectoryMode=0700' "$unit"
          grep -qx 'Environment=XDG_RUNTIME_DIR=/run/dede-tv' "$unit"
          grep -qx 'ReadWritePaths=/home/dede /run/dede-tv' "$unit"
          grep -qx 'ExecStart=/bin/sh /usr/local/bin/dede-kodi-kiosk' "$unit"
          grep -q 'useradd --system --user-group' "$hook"
          ! grep -q -- '--uid 1000' "$hook"
          grep -q 'nolisten tcp' "$kiosk"
          grep -q 'Kodi runtime directory is unavailable' "$kiosk"
          systemd-analyze verify "$unit" "$probe_unit" "$probe_timer"
          # Debug login and diagnostic timer are only enabled inside CI.
          ! grep -q 'serial-getty@ttyS0.service' build/build-image.sh
          ! grep -q 'timers.target.wants' "$hook"
          grep -Fq 'serial-getty@ttyS0.service' .github/workflows/os-image.yml
          grep -Fq 'dede-kiosk-probe.timer' .github/workflows/os-image.yml
      - name: Test first-boot Kodi profile provisioning
        shell: bash
        run: |
          set -euo pipefail
          init=build/config/includes.chroot/usr/local/libexec/dede-kodi-profile-init
          kiosk=build/config/includes.chroot/usr/local/bin/dede-kodi-kiosk
          hook=build/config/hooks/live/0500-dede-kiosk.hook.chroot
          sh -n "$init"
          grep -Fq '/usr/local/libexec/dede-kodi-profile-init' "$kiosk"
          grep -Fq 'chmod 0755 /usr/local/libexec/dede-kodi-profile-init' "$hook"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          HOME="$tmp" sh "$init"
          settings="$tmp/.kodi/userdata/advancedsettings.xml"
          test -s "$settings"
          python3 - "$settings" <<'PY'
          import sys
          from xml.etree import ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          assert root.tag == "advancedsettings"
          for key, expected in (("splash", "false"), ("fullscreen", "true"), ("showexitbutton", "false")):
              assert root.findtext(key) == expected
          PY
          test "$(stat -c '%a' "$settings")" = 600
          printf '%s\n' '<advancedsettings>custom</advancedsettings>' > "$settings"
          HOME="$tmp" sh "$init"
          grep -qx '<advancedsettings>custom</advancedsettings>' "$settings"
          rm "$settings"
          printf '%s\n' 'protected' > "$tmp/protected"
          ln -s "$tmp/protected" "$settings"
          HOME="$tmp" sh "$init"
          grep -qx protected "$tmp/protected"
          test -L "$settings"
          # The graphical settings and JSON-RPC permissions are independent
          # of an administrator's advancedsettings.xml.
          gui="$tmp/.kodi/userdata/guisettings.xml"
          test -s "$gui"
          python3 - "$gui" <<'PY'
          import sys
          from xml.etree import ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          values = {s.attrib["id"]: s.text for s in root.findall("setting")}
          assert values["services.esenabled"] == "true"
          assert values["services.esallinterfaces"] == "false"
          assert values["services.webserver"] == "false"
          assert values["lookandfeel.skin"] == "skin.estuary"
          PY
          test "$(stat -c '%a' "$gui")" = 600
          printf '%s\n' '<settings>admin choice</settings>' > "$gui"
          HOME="$tmp" sh "$init"
          grep -qx '<settings>admin choice</settings>' "$gui"
          rm "$gui"
          printf '%s\n' 'protected gui' > "$tmp/gui-protected"
          ln -s "$tmp/gui-protected" "$gui"
          HOME="$tmp" sh "$init"
          grep -qx 'protected gui' "$tmp/gui-protected"
          test -L "$gui"
          rm "$gui"
          mkdir -p "$tmp/fake-skin"
          printf '%s\n' '<addon id="skin.dede-tv"/>' > "$tmp/fake-skin/addon.xml"
          HOME="$tmp" DEDE_SKIN_ADDON="$tmp/fake-skin/addon.xml" sh "$init"
          grep -Fq 'id="lookandfeel.skin">skin.dede-tv<' "$gui"
      - name: Test bounded Kodi JSON-RPC socket send
        run: python3 -m unittest discover -s tests -p "test_skin_rpc_deadline.py" -v
      - name: Regression - malformed Kodi addon metadata
        run: python3 -m unittest discover -s tests -p "test_skin_addon_response.py" -v
      - name: Validate first-boot skin activation and real Kodi skin detection
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile build/config/includes.chroot/usr/local/libexec/dede-kodi-activate-skin
          python3 - <<'PY'
          import runpy
          import tempfile
          from pathlib import Path
          script = runpy.run_path("build/config/includes.chroot/usr/local/libexec/dede-kodi-activate-skin")
          with tempfile.TemporaryDirectory() as directory:
              settings = Path(directory) / "guisettings.xml"
              script["desired_skin"].__globals__["SETTINGS"] = settings
              settings.write_text('<settings><section id="lookandfeel"><category id="lookandfeel"><setting id="lookandfeel.skin">skin.dede-tv</setting></category></section></settings>')
              assert script["desired_skin"]() == "skin.dede-tv", "Nested Kodi skin preference not detected"
              settings.write_text('<settings><section><setting id="lookandfeel.skin">skin.estuary</setting></section></settings>')
              assert script["desired_skin"]() == "skin.estuary", "Administrator skin preference not respected"
          PY
          python3 - <<'PY'
          from pathlib import Path
          script = Path("build/config/includes.chroot/usr/local/libexec/dede-kodi-activate-skin").read_text()
          service = Path("build/config/includes.chroot/etc/systemd/system/dede-kodi-skin.service").read_text()
          hook = Path("build/config/hooks/live/0500-dede-kiosk.hook.chroot").read_text()
          image = Path(".github/workflows/os-image.yml").read_text()
          assert "Addons.SetAddonEnabled" in script
          assert "Settings.SetSettingValue" in script
          assert 'rpc("Settings.GetSettingValue", {"setting": "lookandfeel.skin"})' in script
          assert 'skin = (actual or {}).get("value")' in script
          assert "Settings.GetSkinSettings" not in script
          assert "127.0.0.1" in script
          assert "NoNewPrivileges=true" in service
          assert "ProtectSystem=strict" in service
          assert "dede-kodi-skin.service" in hook
          assert '"method": "Settings.GetSettingValue"' in image
          assert '"params": {"setting": "lookandfeel.skin"}' in image
          assert 'document.get("result", {}).get("value")' in image
          assert '"method": "Settings.GetSkinSettings"' not in image
          PY
      - name: Regression - Kodi default attribute in GUI settings
        shell: bash
        run: |
          set -euo pipefail
          # This is Kodi's actual rewritten setting format observed in QEMU.
          settings="$(mktemp)"
          trap 'rm -f "$settings"' EXIT
          cat > "$settings" <<'XML'
          <setting id="services.esenabled" default="true">true</setting>
          <setting id="services.esallinterfaces" default="true">false</setting>
          <setting id="services.webserver" default="true">false</setting>
          <setting id="lookandfeel.skin">skin.dede-tv</setting>
          XML
          for expected in \
            'id="services.esenabled">true<' \
            'id="services.esallinterfaces">false<' \
            'id="services.webserver">false<' \
            'id="lookandfeel.skin">skin.dede-tv<'; do
            key="${expected%%>*}"
            value="${expected#*>}"
            grep -Eiq "${key//./\\.}[^>]*>${value}" "$settings"
          done
          # Must still reject an actually unsafe remote-control setting.
          sed -i 's/id="services.esallinterfaces" default="true">false</id="services.esallinterfaces" default="true">true</' "$settings"
          key='id="services.esallinterfaces"'
          value='false<'
          if grep -Eiq "${key//./\\.}[^>]*>${value}" "$settings"; then
            echo 'Insecure remote-control setting was incorrectly accepted' >&2
            exit 1
          fi
      - name: Validate bounded channel resume integration
        shell: bash
        run: |
          set -euo pipefail
          script=build/config/includes.chroot/usr/local/libexec/dede-tv-resume
          service=build/config/includes.chroot/etc/systemd/system/dede-tv-resume.service
          hook=build/config/hooks/live/0500-dede-kiosk.hook.chroot
          sh -n "$script"
          systemd-analyze verify "$service"
          grep -qx 'ConditionFileIsExecutable=/usr/local/bin/dede-tv-core' "$service"
          grep -qx 'After=dede-kodi.service' "$service"
          grep -Fq 'dede-tv-resume.service' "$hook"
          grep -Fq 'chmod 0755 /usr/local/libexec/dede-tv-resume' "$hook"
          temp="$(mktemp -d)"
          trap 'rm -rf "$temp"' EXIT
          export DEDE_CORE_BIN="$temp/core"
          export DEDE_DB_PATH="$temp/channels.db"
          export DEDE_MEDIA_ROOT="$temp/media"
          export DEDE_RESUME_ATTEMPTS=3
          export DEDE_RESUME_DELAY=0
          # Missing binary or database is not a boot-time failure.
          sh "$script"
          cat > "$DEDE_CORE_BIN" <<'SH'
          #!/bin/sh
          count_file="${DEDE_DB_PATH}.attempts"
          count=0
          [ ! -f "$count_file" ] || count="$(cat "$count_file")"
          count=$((count + 1))
          printf '%s\n' "$count" > "$count_file"
          [ "$1" = '--db' ] && [ "$3" = 'resume-last' ] || exit 8
          [ "$count" -ge 3 ]
          SH
          chmod 755 "$DEDE_CORE_BIN"
          touch "$DEDE_DB_PATH"
          sh "$script"
          test "$(cat "$DEDE_DB_PATH.attempts")" = 3
          rm "$DEDE_DB_PATH.attempts"
          export DEDE_RESUME_ATTEMPTS=2
          if sh "$script"; then
            echo 'Core failure was unexpectedly reported as successful' >&2
            exit 1
          fi
          test "$(cat "$DEDE_DB_PATH.attempts")" = 2
      - name: Validate pinned Rust core supply and ISO packaging
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/os-image.yml
          grep -Fq 'DEDE_CORE_SHA: 012ac5993c8ca7a70f8112e6ca3a5e7d4b4b54f9' "$workflow"
          grep -Fq 'git fetch --depth 1 origin "$DEDE_CORE_SHA"' "$workflow"
          grep -Fq 'test "$(git rev-parse HEAD)" = "$DEDE_CORE_SHA"' "$workflow"
          grep -Fq 'cargo build --release --locked --bin dede-tv-core' "$workflow"
          grep -Fq 'install -D -m 0755 target/release/dede-tv-core' "$workflow"
          grep -Fq 'usr/local/bin/dede-tv-core' "$workflow"
          grep -Fq 'unsquashfs -cat "$squashfs" usr/local/bin/dede-tv-core' "$workflow"
      - name: Verify pinned skin integration remains opt-in
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/os-image.yml
          grep -Fq 'DEDE_SKIN_SHA: 9b29fbd2187e902cebe715aa389cd95b17dea622' "$workflow"
          grep -Fq 'DEDE_ESTUARY_SHA: d1a1d48c3cb3722d39264ffdd8132f755ffecd27' "$workflow"
          grep -Fq 'git sparse-checkout set addons/skin.estuary' "$workflow"
          grep -Fq 'usr/share/kodi/addons/skin.dede-tv/addon.xml' "$workflow"
          grep -Fq 'gui.get("version") == "5.17.0"' "$workflow"
          grep -Fq 'assert addon.get("id") == "skin.dede-tv"' "$workflow"
          # A packaged skin must not become the default until Kodi can load it.
          ! grep -Riq 'skin.dede-tv' build/config/includes.chroot/home/ 2>/dev/null || {
            echo 'Skin was activated before a runtime loading test' >&2
            exit 1
          }
      - name: Validate image workflow structure and audit
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -rjson -e 'File.write("/tmp/dede-image-workflow.json", JSON.generate(YAML.load_file(".github/workflows/os-image.yml")))'
          python3 - <<'PY'
          from pathlib import Path
          import json
          p = Path(".github/workflows/os-image.yml")
          text = p.read_text()
          document = json.loads(Path("/tmp/dede-image-workflow.json").read_text())
          jobs = document["jobs"]
          assert set(jobs) == {"image", "report-failure"}, set(jobs)
          assert document["concurrency"]["cancel-in-progress"] is True
          assert "dede-os-image-" in document["concurrency"]["group"]
          assert "var/lib/dpkg/status > installed-dpkg-status" in text
          assert "test -s installed-dpkg-status" in text
          assert text.count("name: Upload installed package inventory") == 1
          assert text.count("name: Publish failed ISO run ID") == 1
          assert "pull_request_target" not in str(document.get("on", {}))
          # Shell comments between QEMU line continuations caused a real
          # failure: -audiodev was executed as a separate command.
          qemu = text.split("timeout --signal=TERM --kill-after=5s 150s", 1)[1]
          qemu = qemu.split("qemu_pid=$!", 1)[0].splitlines()
          for previous, current in zip(qemu, qemu[1:]):
              assert not (previous.rstrip().endswith(chr(92)) and
                          current.lstrip().startswith("#")), (
                  "Shell-breaking comment inside continued QEMU command", current)
          PY
      - name: Report latest trusted-branch ISO results
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${GH_REPO}/actions/workflows/os-image.yml/runs?branch=feat/initial-foundation&per_page=5" \
            --jq '.workflow_runs[] | [.id, .status, (.conclusion // "pending"), .html_url] | @tsv'
