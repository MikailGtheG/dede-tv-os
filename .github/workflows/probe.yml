name: probe live-build bootloaders
on:
  push:
    branches: [dev/claude/probe-live-build]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends live-build grub-common >/dev/null
          lb config --help 2>&1 | grep -i -A2 'boot' | head -60
          grep -n -i 'bootloader' /usr/share/live/build/functions/defaults.sh | head -40
          ls /usr/lib/live/build/ | grep -i -E 'grub|syslinux|loader'
          echo ===== binary_grub-pc; cat /usr/lib/live/build/binary_grub-pc | head -400
          echo ===== binary_loadlin_or_bootloaders; ls /usr/share/live/build/bootloaders/grub-pc
          grub-editenv --help | head -5
