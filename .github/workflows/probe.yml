name: probe live-build bootloaders
on:
  push:
    branches: [dev/claude/probe-live-build]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          gh run download 45832207528 -R "$GITHUB_REPOSITORY" -n dede-tv-debian13-prototype-iso -D iso
          ls -la iso
          img=$(ls iso/*.iso | head -1)
          sudo apt-get install -y -qq xorriso fdisk >/dev/null
          xorriso -indev "$img" -report_system_area plain -report_el_torito plain 2>&1 | tail -40
          sfdisk -d "$img" || true
          sfdisk -l "$img" || true
          cp "$img" disk.img && truncate -s 4G disk.img
          sfdisk -d disk.img || true
          echo ',,L' | sfdisk --append --no-reread --no-tell-kernel disk.img; echo "append=$?"
          sfdisk -d disk.img || true
          xorriso -osirrox on -indev "$img" -extract /boot/grub/grub.cfg grub.cfg -extract /boot/grub/config.cfg config.cfg -extract /isolinux/isolinux.cfg isolinux.cfg -extract /isolinux/live.cfg live.cfg 2>&1 | tail -2
          for f in grub.cfg config.cfg isolinux.cfg live.cfg; do echo "== $f"; cat $f; done
          xorriso -indev "$img" -find /boot/grub -type f 2>/dev/null | head -40
